name: Lago 360 Docs

on:
  push:
    branches: [main]
    paths:
      - "extra/lago-360-docs/**"
      - ".github/workflows/lago-360-docs.yml"
  pull_request:
    paths:
      - "extra/lago-360-docs/**"
      - ".github/workflows/lago-360-docs.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: lago-360-docs-${{ github.ref }}
  cancel-in-progress: true

env:
  DOCS_DIR: extra/lago-360-docs

jobs:
  build:
    name: Check and build documentation
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: extra/lago-360-docs
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.4.1
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: extra/lago-360-docs/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm check

      - name: Unit tests
        run: pnpm test

      - name: Validate executable examples
        shell: bash
        run: |
          set -euo pipefail
          pnpm test:contract
          pnpm test:batch-contract
          node --check examples/batch-events/batch-events.mjs
          python3 -m py_compile examples/batch-events/batch_events.py
          node --check examples/commercial-flow/commercial-flow.mjs
          python3 -m py_compile examples/commercial-flow/commercial_flow.py
          pnpm test:financial-contract
          node --check examples/financial-reconciliation/reconcile.mjs
          python3 -m py_compile examples/financial-reconciliation/reconcile.py

      - name: Contract concurrency test
        run: pnpm test:concurrency

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Build static bundle
        run: pnpm build
        env:
          VITE_BASE_PATH: /${{ github.event.repository.name }}/
          VITE_ANALYTICS_ENDPOINT: ${{ vars.VITE_ANALYTICS_ENDPOINT || '' }}
          VITE_ANALYTICS_WEBSITE_ID: ${{ vars.VITE_ANALYTICS_WEBSITE_ID || '' }}

      - name: Verify production artifact
        run: pnpm smoke-test

      - name: Smoke-test production preview
        shell: bash
        run: |
          set -euo pipefail
          base_path="/${{ github.event.repository.name }}/"
          PORT=4174 BASE_PATH="$base_path" NODE_ENV=production pnpm start > /tmp/lago-360-docs-preview.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          for attempt in {1..20}; do
            if curl --fail --silent --show-error "http://127.0.0.1:4174${base_path}" > /tmp/lago-360-docs-home.html; then
              break
            fi
            sleep 1
          done
          grep -q "Lago 360" /tmp/lago-360-docs-home.html
          UI_BASE_URL="http://127.0.0.1:4174${base_path}" pnpm test:subpaths
          UI_BASE_URL="http://127.0.0.1:4174${base_path}" pnpm test:ui

      - name: Upload GitHub Pages artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: extra/lago-360-docs/dist/public

  deploy:
    name: Deploy documentation
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
